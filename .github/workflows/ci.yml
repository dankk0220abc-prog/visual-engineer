name: CI / Fast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy and secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: scripts/check-publication-secrets.sh
      - name: Reject tracked runtime and credential files
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(\.env($|\.)|\.runtime/|test-results/|playwright-report/|coverage/|htmlcov/|node_modules/|\.next/|.*\.(log|db|sqlite|sqlite3|dump|pem|p12|pfx))' | grep -Ev '(^|/)\.env\.example$' || true)"

  backend:
    name: Python unit, integration, format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: visualengineer
          POSTGRES_PASSWORD: visualengineer-test-local
          POSTGRES_DB: visualengineer_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U visualengineer -d visualengineer_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://visualengineer:visualengineer-test-local@localhost:55433/visualengineer_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12.13
      - run: uv sync --frozen
      - run: make format-check-api
      - run: make lint-api
      - run: make typecheck-api
      - run: make test-api-direct

  runner:
    name: Runner protocol, security, and source invariance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12.13
      - run: uv sync --frozen
      - run: uv run ruff format --check apps/runner packages/runner-protocol
      - run: uv run ruff check apps/runner packages/runner-protocol
      - run: uv run mypy apps/runner packages/runner-protocol
      - run: make test-runner
      - run: make source-invariance-check

  frontend:
    name: Web unit, translation integrity, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm fetch --frozen-lockfile
      - run: pnpm install --offline --frozen-lockfile
      - run: make format-check-web
      - run: make lint-web
      - run: make typecheck-web
      - name: Web unit and translation integrity
        run: make test-web
      - run: make build-web

  protocol-contract:
    name: OpenAPI and generated contract integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv python install 3.12.13
      - run: uv sync --frozen
      - run: pnpm fetch --frozen-lockfile
      - run: pnpm install --offline --frozen-lockfile
      - run: make contracts-check
