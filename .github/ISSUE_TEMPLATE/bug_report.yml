name: Bug report
description: Report a reproducible defect using synthetic data only.
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Do not include secrets, customer data,
        private repository content, real host paths, database dumps, or account screenshots.
        Follow SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Exact commit SHA or local revision tested.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web Console
        - API / Control Plane
        - Local Runner
        - Repository scanner
        - Workspace / validation
        - Contracts / migrations
        - Documentation / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps using repository fixtures or redacted placeholders.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: Commands, exit codes, and sanitized errors. Do not paste full logs.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, PII, customer content, private paths, and account data.
          required: true
        - label: This is not a vulnerability report.
          required: true
