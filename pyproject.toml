[project]
name = "visual-engineer-api"
version = "0.1.0"
description = "Foundation API for VisualEngineer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.4,<2",
  "fastapi>=0.116.1,<1",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.5,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "apps/api/tests"]
mypy_path = ["apps/api/src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=visual_engineer_api --cov-report=term-missing --cov-report=html --cov-fail-under=80"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]

[tool.coverage.run]
branch = true
source = ["visual_engineer_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
