name: visualengineer

services:
  db:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visualengineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visualengineer-local}
      POSTGRES_DB: ${POSTGRES_DB:-visualengineer}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-db:
    image: postgres:17.10-alpine3.24
    profiles: ["test"]
    environment:
      POSTGRES_USER: visualengineer
      POSTGRES_PASSWORD: visualengineer-test-local
      POSTGRES_DB: visualengineer_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PUBLISHED_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visualengineer -d visualengineer_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visualengineer}:${POSTGRES_PASSWORD:-visualengineer-local}@db:5432/${POSTGRES_DB:-visualengineer}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUNNER_BOOTSTRAP_TOKEN: ${RUNNER_BOOTSTRAP_TOKEN:-}
      RUNNER_ONLINE_THRESHOLD_SECONDS: ${RUNNER_ONLINE_THRESHOLD_SECONDS:-8}
      RUNNER_LEASE_SECONDS: ${RUNNER_LEASE_SECONDS:-6}
      RUNNER_JOB_MAX_ATTEMPTS: ${RUNNER_JOB_MAX_ATTEMPTS:-2}
      RUNNER_MAX_RESULT_BYTES: ${RUNNER_MAX_RESULT_BYTES:-8192}
      RUNNER_ENVELOPE_TTL_SECONDS: ${RUNNER_ENVELOPE_TTL_SECONDS:-300}
      RUNNER_REAPER_INTERVAL_SECONDS: ${RUNNER_REAPER_INTERVAL_SECONDS:-1}
    ports:
      - "127.0.0.1:${API_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - runner-control
    command:
      - /bin/sh
      - -c
      - alembic -c apps/api/alembic.ini upgrade head && exec uvicorn visual_engineer_api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    environment:
      RUNNER_CONTROL_PLANE_URL: http://api:8000
      RUNNER_BOOTSTRAP_TOKEN: ${RUNNER_BOOTSTRAP_TOKEN:-}
      RUNNER_DISPLAY_NAME: ${RUNNER_DISPLAY_NAME:-Local Docker Runner}
      RUNNER_SOFTWARE_VERSION: ${RUNNER_SOFTWARE_VERSION:-0.4.0}
      RUNNER_CREDENTIAL_PATH: /var/lib/visual-engineer-runner/credentials.json
      RUNNER_HEARTBEAT_INTERVAL_SECONDS: ${RUNNER_HEARTBEAT_INTERVAL_SECONDS:-3}
      RUNNER_POLL_INTERVAL_SECONDS: ${RUNNER_POLL_INTERVAL_SECONDS:-0.5}
      RUNNER_WORKSPACE_PREPARE_DELAY_MS: ${RUNNER_WORKSPACE_PREPARE_DELAY_MS:-0}
      RUNNER_WORKSPACE_WRITE_COMMIT_DELAY_MS: ${RUNNER_WORKSPACE_WRITE_COMMIT_DELAY_MS:-0}
      RUNNER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - runner-control
    volumes:
      - runner-credentials:/var/lib/visual-engineer-runner
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  runner-credentials:

networks:
  runner-control:
    internal: true
